# agmsg agent-type manifest for DeepSeek Harness (dsh) and dsh-TUI sessions.
# Read-only key=value data; agmsg never sources this file.
#
# A dsh session joins a team through the dsh-agmsg plugin, which runs the
# agmsg scripts on the session's behalf. Inbound delivery is owned by that
# plugin: it keeps one watch.sh per joined session inside the dsh process and
# hands each message to the session's agent, so there is no hook file to write.
name=dsh
template=template.md
cli=dsh
# dsh runs as `node`, so these names only keep agmsg from falling back to its
# claude/codex/gemini process list. The plugin passes AGMSG_AGENT_PID itself.
detect=explicit
detect_proc=dsh dsh-tui rdsh
readiness_sentinel=no
delivery_modes=monitor
